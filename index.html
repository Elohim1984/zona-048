<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zona Escolar Inteligente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Noto+Serif:wght@600;700&display=swap">
<style>
/* Layout: portada con panel institucional + tarjeta de acceso; app con barra lateral guinda, barra superior fija y contenido en rejilla */
:root{
  --guinda:#9F2241; --guinda-d:#691C32; --oro:#BC955C; --oro-l:#E9DCC6; --verde:#235B4E;
  --bg:#F5F2EE; --surface:#FFFFFF; --surface-2:#F1ECE6; --line:#E2D9CF; --fg:#221B1E; --muted:#6C6266;
  --accent:#9F2241; --accent-2:#691C32; --accent-soft:#F6E7EB; --accent-fg:#FFFFFF;
  --side:#5A1830; --side-2:#4A1427; --side-fg:#F5EAEE; --side-muted:#D9B9C4;
  --ok:#1E7A4F; --ok-bg:#E3F2EA; --warn:#9A6212; --warn-bg:#FBEFD9; --bad:#B42318; --bad-bg:#FBE5E2; --info:#2B5C8A; --info-bg:#E2ECF6; --neutral-bg:#ECE7E2;
  --shadow:0 1px 2px rgba(60,20,35,.06),0 4px 14px rgba(60,20,35,.06);
  --f-ui:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-display:"Noto Serif",Georgia,"Times New Roman",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161214; --surface:#201A1D; --surface-2:#2A2226; --line:#3A3035; --fg:#F2ECEE; --muted:#AEA2A7;
  --accent:#D9567A; --accent-2:#F08AA6; --accent-soft:#3A1E28; --accent-fg:#1A0A10;
  --oro:#D5B07B; --oro-l:#3A3125; --side:#1C0F15; --side-2:#140A0F; --side-fg:#F2E4E9; --side-muted:#B89AA5;
  --ok:#5CC994; --ok-bg:#16301F; --warn:#E6B45E; --warn-bg:#36290F; --bad:#F2877A; --bad-bg:#3B1A16; --info:#85B5E3; --info-bg:#172A3D; --neutral-bg:#2C2528;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161214; --surface:#201A1D; --surface-2:#2A2226; --line:#3A3035; --fg:#F2ECEE; --muted:#AEA2A7;
  --accent:#D9567A; --accent-2:#F08AA6; --accent-soft:#3A1E28; --accent-fg:#1A0A10;
  --oro:#D5B07B; --oro-l:#3A3125; --side:#1C0F15; --side-2:#140A0F; --side-fg:#F2E4E9; --side-muted:#B89AA5;
  --ok:#5CC994; --ok-bg:#16301F; --warn:#E6B45E; --warn-bg:#36290F; --bad:#F2877A; --bad-bg:#3B1A16; --info:#85B5E3; --info-bg:#172A3D; --neutral-bg:#2C2528;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--oro)}
a{color:var(--accent)}

/* Botones y campos */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
textarea.input{resize:vertical;min-height:88px}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.span2{grid-column:1/-1}

/* Chips de estado */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--neutral-bg);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}

/* ===== Portada ===== */
.landing{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.hero{background:var(--guinda-d);color:#F7EEF1;position:relative;overflow:hidden;padding-block:40px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:32px;display:flex;flex-direction:column;gap:28px}
.hero::after{content:"";position:absolute;inset:auto -120px -160px auto;width:420px;height:420px;border-radius:50%;border:56px solid rgba(188,149,92,.18)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:10px;background:#BC955C;color:#4A1427;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.02em;flex:none}
.brand b{display:block;font-size:15px}
.brand span{font-size:12px;opacity:.8}
.hero h1{font-family:var(--f-display);font-size:clamp(28px,4vw,44px);max-width:16ch;color:#fff}
.hero .lead{font-size:16px;max-width:52ch;opacity:.92}
.hero .strip{height:6px;width:120px;background:linear-gradient(90deg,#BC955C 0 33%,#fff 33% 66%,#235B4E 66%);border-radius:3px}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:620px;position:relative;z-index:1}
.mods div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px 14px;font-size:13px}
.mods b{display:block;color:#E9D2A9;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.roles-line{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.roles-line span{border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px;font-size:12px}
.auth{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-card{width:100%;max-width:430px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.form{display:flex;flex-direction:column;gap:14px}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.err{font-size:12.5px;color:var(--bad);min-height:1em}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.keybox{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
@media (max-width:900px){.landing{grid-template-columns:1fr}.hero{padding-right:max(20px,env(safe-area-inset-right,0px));padding-left:max(20px,env(safe-area-inset-left,0px))}.mods{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.mods{grid-template-columns:1fr}}

/* ===== Asistente de configuración ===== */
.wizard{min-height:100vh;display:flex;justify-content:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wiz-card{width:100%;max-width:720px;display:flex;flex-direction:column;gap:20px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.steps div{height:5px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--accent)}
.wiz-body{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.wiz-body h2{font-family:var(--f-display);font-size:26px}
.choice{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.choice label{border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600}
.choice input{accent-color:var(--accent)}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.wiz-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ===== Aplicación ===== */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;gap:18px}
.side .brand{padding:0 6px}
.side .brand span{color:var(--side-muted);opacity:1}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:10px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a svg{width:18px;height:18px;opacity:.85;flex:none}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.14);font-weight:700;box-shadow:inset 3px 0 0 var(--oro)}
.nav .mnum{margin-left:auto;font-size:10.5px;color:var(--side-muted);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--side-muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.lic{background:var(--side-2);border-radius:8px;padding:10px;font-size:11.5px}
.lic b{color:var(--side-fg);display:block}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.top .crumb{min-width:0;flex:1}
.top .crumb b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rolesel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.rolesel select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;font-size:12.5px}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;flex:none;position:relative}
.icon-btn svg{width:18px;height:18px}
.icon-btn .badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.menu-btn{display:none}
.main{padding-block:24px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head h1{font-family:var(--f-display);font-size:clamp(22px,3vw,30px)}
.page-head p{color:var(--muted);margin-top:4px;max-width:70ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.scrim{display:none}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:30;transform:translateX(-100%);transition:transform .2s ease;padding-top:max(18px,env(safe-area-inset-top,0px))}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(20,8,12,.45);z-index:25}
  .menu-btn{display:grid}
  .rolesel span{display:none}
}
@media (max-width:520px){.top .crumb span{display:none}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h3{font-size:15px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1060px){.cols,.cols.even{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k-label{font-size:12px;font-weight:600;color:var(--muted)}
.kpi .k-val{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k-sub{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.ok i{background:var(--ok)}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--surface-2);font-size:13px}
.alert .dot{margin-top:5px}
.alert a{font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2);padding:10px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
td.clip{max-width:320px}
tr:hover td{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
td.act{white-space:nowrap;text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search input{padding-left:34px}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.date-badge{width:46px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;line-height:1.1}
.date-badge b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.date-badge span{font-size:10px;text-transform:uppercase;color:var(--accent);font-weight:700;letter-spacing:.06em}
.li-title{font-weight:600;font-size:13.5px}
.li-sub{font-size:12px;color:var(--muted)}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.ev{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.ev .ph{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);max-width:100%}
.ev .ph img{width:100%;height:100%;object-fit:cover}
.ev .ph svg{width:34px;height:34px}
.ev .ev-b{padding:10px 12px;display:flex;flex-direction:column;gap:3px}

.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;font-size:13px;cursor:pointer;background:none;text-align:left}
.check.done{border-style:solid;color:var(--muted)}
.check .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.check.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.check.done .ck svg{width:12px;height:12px}

.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.chart .lbl{fill:var(--fg);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,8,12,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding-block:max(40px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal.wide{max-width:900px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.modal-h h3{font-size:16px}
.modal-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* IA */
.ia-grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px}
@media (max-width:1000px){.ia-grid{grid-template-columns:1fr}}
.doc-types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.doc-types label{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.doc-types label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.doc-types input{accent-color:var(--accent);margin-top:2px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:420px;display:flex;flex-direction:column;min-width:0}
.paper-h{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.paper-b{padding:24px 28px;font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.paper-b h2{font-family:var(--f-display);font-size:20px;margin:18px 0 8px;color:var(--accent)}
.paper-b h2:first-child{margin-top:0}
.paper-b h3{font-size:15px;margin:14px 0 6px}
.paper-b p{margin:0 0 10px;max-width:72ch}
.paper-b ul{margin:0 0 10px;padding-left:20px;max-width:72ch}
.paper-b .ph-empty{color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.paper textarea{border:0;border-radius:0;min-height:420px;padding:24px 28px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--surface)}
.thinking{display:flex;gap:8px;align-items:center;color:var(--muted)}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none}.side{transition:none}}

/* Repositorio */
.folders{display:flex;gap:6px;flex-wrap:wrap}
.folder{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.folder[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.ftype{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:#fff;flex:none}
.ft-pdf{background:#B42318}.ft-doc{background:#2B5C8A}.ft-xls{background:#1E7A4F}.ft-img{background:#9A6212}.ft-vid{background:#6B3FA0}.ft-txt{background:#691C32}.ft-otro{background:#6C6266}

.rep-grid{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:20px}
@media (max-width:900px){.rep-grid{grid-template-columns:1fr}}
.rep-list{display:flex;flex-direction:column;gap:6px}
.rep-item{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.rep-item b{font-size:13px}
.rep-item span{font-size:11.5px;color:var(--muted)}
.rep-item[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:700}.no{color:var(--muted)}
.mini{font-size:12px}
.sem{display:flex;align-items:center;gap:8px}

function shrinkImage(file) {

/* ================= Gráficas ================= */
function hbars(items, {stack = null, max = null} = {}) {
  // items: [{label, values:[n,...]}]; stack: [{name, color}]
  const W = 560, lw = 170, rh = 30, top = 6;
  const H = top + items.length * rh + 22;
  const tot = items.map(it => it.values.reduce((a,b) => a + b, 0));
  const mx = max || Math.max(1, ...tot);
  const step = mx <= 5 ? 1 : mx <= 10 ? 2 : Math.ceil(mx / 5);
  const ticks = []; for (let t = 0; t <= mx; t += step) ticks.push(t);
  const x = v => lw + (W - lw - 30) * v / mx;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img">`;
  ticks.forEach(t => svg += `<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H - 18}" stroke="var(--line)"/><text x="${x(t)}" y="${H - 4}" text-anchor="middle">${t}</text>`);
  items.forEach((it, i) => {
    const y = top + i * rh;
    const lab = it.label.length > 24 ? it.label.slice(0, 23) + '…' : it.label;
    svg += `<text class="lbl" x="${lw - 10}" y="${y + rh / 2 + 4}" text-anchor="end">${esc(lab)}</text>`;
    let acc = 0;
    it.values.forEach((v, j) => {
      if (!v) return;
      svg += `<rect x="${x(acc)}" y="${y + 6}" width="${Math.max(2, x(acc + v) - x(acc))}" height="${rh - 12}" rx="3" fill="${stack ? stack[j].color : 'var(--accent)'}"/>`;
      acc += v;
    });
    svg += `<text x="${x(acc) + 6}" y="${y + rh / 2 + 4}" style="fill:var(--fg);font-weight:600">${it.display ?? acc}</text>`;
  });
  svg += '</svg>';
  const leg = stack ? `<div class="legend">${stack.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return leg + `<div style="overflow-x:auto">${svg}</div>`;
}
function ring(parts, center, sub) {

  let off = 0, s = `<svg viewBox="0 0 140 140" width="140" height="140" role="img"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="16"/>`;
  parts.forEach(p => { const len = C * p.v / tot; if (p.v) s += `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${p.color}" stroke-width="16" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off += len; });
  s += `<text x="70" y="70" text-anchor="middle" style="fill:var(--fg);font-size:24px;font-weight:700;font-family:var(--f-ui)">${center}</text><text x="70" y="88" text-anchor="middle" style="fill:var(--muted);font-size:10.5px;font-family:var(--f-ui)">${sub}</text></svg>`;
  return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">${s}<div class="legend" style="flex-direction:column;gap:6px">${parts.map(p => `<span><i style="background:${p.color}"></i>${esc(p.name)}: <b class="num" style="color:var(--fg)">${p.v}</b></span>`).join('')}</div></div>`;
}

/* ================= Indicadores ================= */
function escuelaStats(e) {
  const vis = S.visitas.filter(v => v.escuela === e.nombre);
  const real = vis.filter(v => v.estado === 'Realizada').sort((a,b) => b.fecha.localeCompare(a.fecha));
  const acu = S.acuerdos.filter(a => a.escuela === e.nombre && a.estado !== 'Cumplido');
  const venc = acu.filter(vencido).length;
  const ult = real[0]?.fecha;
  const sin = ult ? -daysFrom(ult) : 999;
  const sem = venc > 0 || sin > 45 ? 'bad' : (acu.length > 2 || sin > 30 ? 'warn' : 'ok');
  return {docentes:S.personal.filter(p => p.rol === 'Docente' && p.escuela === e.nombre).length, grupos:S.grupos.filter(g => g.escuela === e.nombre).length,
    prog:vis.filter(v => v.estado === 'Programada').length, real:real.length, canc:vis.filter(v => v.estado === 'Cancelada').length, ult, abiertos:acu.length, venc, sin, sem};
}
const SEMTXT = {ok:'En orden', warn:'Atención', bad:'Prioridad'};
function alertas() {
  const a = [];
  S.acuerdos.filter(vencido).forEach(x => a.push({lvl:'bad', txt:`Acuerdo vencido (${fmtD(x.limite)}): ${x.acuerdo}`, sub:`${x.escuela} · ${x.responsable}`, go:'cte', tab:'acuerdos'}));
  S.escuelas.forEach(e => { const st = escuelaStats(e); if (st.sin > 30) a.push({lvl:'warn', txt:`${e.nombre} no recibe visita realizada ${st.ult ? `desde hace ${st.sin} días` : 'en este ciclo'}.`, sub:e.cct, go:'acompanamiento', tab:'visitas'}); });
  S.visitas.filter(v => v.estado === 'Programada' && daysFrom(v.fecha) >= 0 && daysFrom(v.fecha) <= 7).forEach(v => a.push({lvl:'info', txt:`Visita ${daysFrom(v.fecha) === 0 ? 'hoy' : daysFrom(v.fecha) === 1 ? 'mañana' : 'el ' + fmtD(v.fecha)}: ${v.escuela}`, sub:`${v.tipo} · ${v.atp}`, go:'acompanamiento', tab:'visitas'}));
  S.sesiones.filter(s => daysFrom(s.fecha) >= 0 && daysFrom(s.fecha) <= 7).forEach(s => a.push({lvl:'info', txt:`${s.sesion} del CTE el ${fmtD(s.fecha)}`, sub:'Prepara la agenda y la minuta', go:'cte', tab:'sesiones'}));
  const pend = S.planeaciones.filter(p => p.estado === 'Entregada').length;
  if (pend) a.push({lvl:'info', txt:`${pend} ${pend === 1 ? 'planeación espera' : 'planeaciones esperan'} revisión.`, sub:'Trabajo docente', go:'docente', tab:'planeaciones'});
  const falt = (Number(S.zona.numEscuelas) || 0) - S.escuelas.length;
  if (falt > 0) a.push({lvl:'info', txt:`Faltan ${falt} escuelas por registrar de las ${S.zona.numEscuelas} de la zona.`, sub:'Configuración de la zona', go:'zona', tab:'escuelas'});
  const riesgo = S.evaluaciones.filter(e => Number(e.enRiesgo) >= 5);
  riesgo.forEach(e => a.push({lvl:'warn', txt:`${e.grupo} tiene ${e.enRiesgo} alumnos en riesgo (promedio ${e.promedio}).`, sub:e.docente, go:'docente', tab:'seguimiento'}));
  const order = {bad:0, warn:1, info:2};
  return a.sort((x, y) => order[x.lvl] - order[y.lvl]);
}
const alertDot = l => `<span class="dot ${l === 'info' ? '' : l}" style="${l === 'info' ? 'background:var(--info)' : ''}"></span>`;
function alertsHTML(list, max = 6) {
  if (!list.length) return `<div class="empty">${ic('check')}Sin alertas. Todo está al día.</div>`;
  return `<div class="alerts">${list.slice(0, max).map(a => `<div class="alert">${alertDot(a.lvl)}<div><div>${esc(a.txt)}</div><div class="li-sub">${esc(a.sub)}</div></div><a data-go="${a.go}" data-tab="${a.tab}">Ver</a></div>`).join('')}</div>${list.length > max ? `<p class="muted mini">y ${list.length - max} alertas más.</p>` : ''}`;
}
const kpi = (label, val, sub, bar) => `<div class="kpi"><span class="k-label">${label}</span><span class="k-val">${val}</span>${bar != null ? `<div class="bar ${bar >= 80 ? 'ok' : ''}"><i style="width:${Math.min(100, bar)}%"></i></div>` : ''}<span class="k-sub">${sub}</span></div>`;
function agendaHTML(list) {
  if (!list.length) return `<div class="empty">No hay visitas próximas.</div>`;
  return `<div class="list">${list.map(v => { const d = parseD(v.fecha); return `<div class="li"><div class="date-badge"><b>${d.getDate()}</b><span>${MESES[d.getMonth()]}</span></div><div style="min-width:0"><div class="li-title">${esc(v.escuela)}</div><div class="li-sub">${esc(v.tipo)} · ${esc(v.docente !== '—' ? v.docente : 'Escuela completa')} · ${esc(v.atp)}</div></div>${chip(v.estado)}</div>`; }).join('')}</div>`;
}

/* ================= Vistas ================= */
function pageHead(t, p, act = '') { return `<div class="page-head"><div><div class="eyebrow">${esc(S.zona.nombre || 'Mi zona')} · Ciclo ${esc(S.zona.ciclo || '')}</div><h1>${t}</h1>${p ? `<p>${p}</p>` : ''}</div><div class="actions">${act}</div></div>`; }
function subtabs(view, tabs) {
  const cur = UI.tab[view] || tabs[0][0];
  return `<div class="subtabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${k === cur}" data-subtab="${view}" data-k="${k}">${esc(l)}</button>`).join('')}</div>`;
}
const curTab = (v, d) => UI.tab[v] || d;

function setupChecklist() {
  const items = [
    ['Registrar escuelas', S.escuelas.length >= (Number(S.zona.numEscuelas) || 1), 'zona', 'escuelas'],
    ['Registrar directores', S.personal.some(p => p.rol === 'Director'), 'zona', 'personal'],
    ['Registrar ATP', S.personal.some(p => p.rol === 'ATP'), 'zona', 'personal'],
    ['Registrar docentes', S.personal.some(p => p.rol === 'Docente'), 'zona', 'personal'],
    ['Crear grupos', S.grupos.length > 0, 'zona', 'grupos'],
    ['Formar academias', S.academias.length > 0, 'zona', 'academias'],
    ['Programar la primera visita', S.visitas.length > 0, 'acompanamiento', 'visitas'],
    ['Registrar una sesión de CTE', S.sesiones.length > 0, 'cte', 'sesiones']];
  const done = items.filter(i => i[1]).length;

}

    </div>

        ${S.escuelas.length ? hbars(S.escuelas.map(e => { const s = escuelaStats(e); return {label:e.nombre, values:[s.real, s.prog]}; }), {stack:[{name:'Realizadas', color:'var(--accent)'}, {name:'Programadas', color:'var(--oro)'}]}) : '<div class="empty">Registra escuelas para ver esta gráfica.</div>'}

        <div class="tbl-wrap"><table><thead><tr><th>Escuela</th><th>Matrícula</th><th>Docentes</th><th>Última visita</th><th>Acuerdos abiertos</th><th>Estado</th></tr></thead><tbody>
        ${S.escuelas.map(e => { const s = escuelaStats(e); return `<tr><td><b>${esc(e.nombre)}</b><div class="li-sub">${esc(e.cct)} · ${esc(e.turno)}</div></td><td class="num">${e.matricula || '—'}</td><td class="num">${s.docentes}</td><td class="num">${s.ult ? fmtD(s.ult) : 'Sin visita'}</td><td class="num">${s.abiertos}${s.venc ? ` <span class="chip bad">${s.venc} vencido${s.venc > 1 ? 's' : ''}</span>` : ''}</td><td><span class="sem"><span class="dot ${s.sem}"></span>${SEMTXT[s.sem]}</span></td></tr>`; }).join('') || `<tr><td colspan="6"><div class="empty">Sin escuelas registradas.</div></td></tr>`}
        </tbody></table></div></div>
      <div class="panel"><div class="panel-h"><h3>Seguimiento de acuerdos</h3></div>

}

function md(t) {
  const lines = t.split('\n'); let h = '', inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (/^\s*[-*•]\s+/.test(l)) { if (!inList) { h += '<ul>'; inList = true; } h += `<li>${inline(l.replace(/^\s*[-*•]\s+/, ''))}</li>`; continue; }
    if (inList) { h += '</ul>'; inList = false; }
    if (/^#\s/.test(l) || /^##\s/.test(l)) h += `<h2>${inline(l.replace(/^#+\s/, ''))}</h2>`;
    else if (/^###\s/.test(l)) h += `<h3>${inline(l.replace(/^#+\s/, ''))}</h3>`;
    else if (l.trim()) h += `<p>${inline(l)}</p>`;
  }
  if (inList) h += '</ul>';
  return h;
}

let DL = null;
async function saveFile(filename, data) {

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Descarga iniciada'); log(`Descargó ${filename}`); save(); return;
  }
  try { await DL.save({filename, data}); toast('Archivo listo'); log(`Descargó ${filename}`); save(); }
  catch (e) { if (e.code !== 'declined') toast(e.code === 'rate_limited' ? 'Espera un momento y vuelve a intentar.' : 'No se pudo descargar el archivo.'); }
}
const xmlEsc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function wRun(t, {b = false, sz = 22, color = null, font = 'Arial'} = {}) { return `<w:r><w:rPr><w:rFonts w:ascii="${font}" w:hAnsi="${font}" w:cs="${font}"/>${b ? '<w:b/>' : ''}${color ? `<w:color w:val="${color}"/>` : ''}<w:sz w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>`; }
function wPara(runs, {after = 120, ind = 0, jc = null} = {}) { return `<w:p><w:pPr><w:spacing w:after="${after}"/>${ind ? `<w:ind w:left="${ind}" w:hanging="240"/>` : ''}${jc ? `<w:jc w:val="${jc}"/>` : ''}</w:pPr>${runs}</w:p>`; }
function inlineRuns(t, opts = {}) { return t.split(/(\*\*.+?\*\*)/g).filter(Boolean).map(p => p.startsWith('**') ? wRun(p.slice(2, -2), {...opts, b:true}) : wRun(p, opts)).join(''); }
async function makeDocx(title, text, table) {
  let body = wPara(wRun(`${S.zona.nombre} · ${S.zona.nivel} · ${S.zona.estado}`, {sz:18, color:'BC955C', b:true}), {after:60});
  body += wPara(wRun(title, {b:true, sz:32, color:'691C32'}), {after:200});

    if (/^#{1,2}\s/.test(s)) body += wPara(wRun(s.replace(/^#+\s/, ''), {b:true, sz:28, color:'691C32'}), {after:120});
    else if (/^###\s/.test(s)) body += wPara(wRun(s.replace(/^#+\s/, ''), {b:true, sz:24}), {after:80});
    else if (/^[-*•]\s/.test(s)) body += wPara(wRun('•  ') + inlineRuns(s.replace(/^[-*•]\s/, '')), {ind:360, after:60});
    else body += wPara(inlineRuns(s));

    const n = table.head.length, cw = Math.floor(9972 / n);

  }

  const zip = new JSZip();
  zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/document.xml', doc);
  return zip.generateAsync({type:'blob'});
}
function pdfBase(title) {
  const {jsPDF} = window.jspdf; const doc = new jsPDF({unit:'pt', format:'letter'});
  const W = doc.internal.pageSize.getWidth();
  doc.setFillColor(105, 28, 50); doc.rect(0, 0, W, 64, 'F');
  doc.setFillColor(188, 149, 92); doc.rect(0, 64, W, 4, 'F');
  doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
  doc.text(`${S.zona.nombre} · ${S.zona.nivel} · ${S.zona.estado}`.toUpperCase(), 40, 28);
  doc.setFontSize(15); doc.text(title, 40, 48);
  doc.setTextColor(34, 27, 30); doc.setFont('helvetica', 'normal');
  return doc;
}
function pdfText(title, text) {
  const doc = pdfBase(title); const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  let y = 96;
  const put = (t, size, bold, color = [34, 27, 30], indent = 0, gap = 4) => {
    doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...color);
    doc.splitTextToSize(t, W - 80 - indent).forEach(ln => { if (y > H - 50) { doc.addPage(); y = 50; } doc.text(ln, 40 + indent, y); y += size * 1.35; });
    y += gap;
  };
  text.split('\n').forEach(l => {
    const s = l.trim(); if (!s) return; const clean = s.replace(/\*\*/g, '');
    if (/^#{1,2}\s/.test(s)) { y += 6; put(clean.replace(/^#+\s/, ''), 13, true, [105, 28, 50]); }
    else if (/^###\s/.test(s)) put(clean.replace(/^#+\s/, ''), 11.5, true);
    else if (/^[-*•]\s/.test(s)) put('•  ' + clean.replace(/^[-*•]\s/, ''), 10.5, false, [34, 27, 30], 10, 2);
    else put(clean, 10.5, false);
  });
  return doc.output('blob');
}

const mask = k => k ? k.slice(0, 8) + '-••••-••••-' + k.slice(-4) : '—';
async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptBackup(pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(S)));
  return JSON.stringify({formato:'ZEI-respaldo', version:1, cifrado:'AES-256-GCM', kdf:'PBKDF2-SHA256', iteraciones:150000, creado:new Date().toISOString(), zona:S.zona.nombre, salt:b64(salt), iv:b64(iv), datos:b64(ct)}, null, 1);
}
async function decryptBackup(txt, pass) {
  const o = JSON.parse(txt);
  const key = await deriveKey(pass, unb64(o.salt));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv)}, key, unb64(o.datos));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ================= KEY de activación ================= */
const KA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function keyCheck(g) { let s = 0; for (let i = 0; i < g.length; i++) s = (s * 31 + KA.indexOf(g[i]) * (i + 7)) % 1048576; let o = ''; for (let i = 0; i < 4; i++) { o += KA[s % 32]; s = Math.floor(s / 32); } return o; }
function genKey() { let g = ''; for (let i = 0; i < 12; i++) g += KA[Math.floor(Math.random() * 32)]; return `ZEI-${g.slice(0, 4)}-${g.slice(4, 8)}-${g.slice(8)}-${keyCheck(g)}`; }
function validKey(k) {
  k = k.trim().toUpperCase();
  if (k === 'ZEI-DEMO-0048-PUEB-LA26') return k;
  const m = k.match(/^ZEI-([A-Z2-9]{4})-([A-Z2-9]{4})-([A-Z2-9]{4})-([A-Z2-9]{4})$/);
  if (!m) return null;
  return keyCheck(m[1] + m[2] + m[3]) === m[4] ? k : null;
}

    ROLE = 'supervisor'; store.set('zei-role', ROLE); log('Abrió la demostración'); save(); location.hash = 'inicio'; render(); return;

document.addEventListener('dragleave', e => { const d = e.target.closest?.('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest?.('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files, d.dataset.folder); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#app')?.classList.remove('open'); } });
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'ent-form') return;
  e.preventDefault();
  const v = id => $('#' + id).value.trim();
  if (f.id === 'f-login') {
    const users = store.get('zei-users', {}); const u = users[v('l-mail').toLowerCase()];
    if (!u || u.hash !== await sha256(u.salt + $('#l-pass').value)) { $('#l-err').textContent = 'El correo o la contraseña no coinciden. Revisa e intenta de nuevo.'; return; }
    SESSION = {nombre:u.nombre, correo:v('l-mail').toLowerCase()}; store.set('zei-session', SESSION);
    load(); ROLE = 'supervisor'; log('Inició sesión'); save(); render(); return;
  }
  if (f.id === 'f-reg') {
    if ($('#r-p1').value !== $('#r-p2').value) { $('#r-err').textContent = 'Las contraseñas no coinciden.'; return; }
    const users = store.get('zei-users', {}); const mail = v('r-mail').toLowerCase();
    if (users[mail]) { $('#r-err').textContent = 'Ya existe una cuenta con este correo. Inicia sesión.'; return; }
    const salt = uid() + uid();
    users[mail] = {nombre:v('r-nom'), salt, hash:await sha256(salt + $('#r-p1').value)}; store.set('zei-users', users);
    SESSION = {nombre:v('r-nom'), correo:mail}; store.set('zei-session', SESSION);
    S = emptyData(); store.set('zei-data', S); ROLE = 'supervisor'; store.set('zei-role', ROLE); render(); toast('Cuenta creada'); return;
  }
  if (f.id === 'f-rec') {
    const users = store.get('zei-users', {}); const mail = v('rc-mail').toLowerCase(); const data = store.get('zei-data', null);
    if (!users[mail]) { $('#rc-err').textContent = 'No encontramos una cuenta con ese correo.'; return; }
    if (!data?.licencia || data.licencia.key !== v('rc-key').toUpperCase()) { $('#rc-err').textContent = 'La KEY no corresponde a la licencia de esta cuenta.'; return; }
    users[mail].salt = uid() + uid(); users[mail].hash = await sha256(users[mail].salt + $('#rc-p').value); store.set('zei-users', users);
    UI.authTab = 'login'; render(); toast('Contraseña actualizada. Ya puedes iniciar sesión.'); return;
  }
  if (f.id === 'f-key' || f.id === 'relic') {
    const inp = f.id === 'f-key' ? 'k-in' : 'relic-key', err = f.id === 'f-key' ? 'k-err' : 'relic-err';
    const k = validKey(v(inp));
    if (!k) { $('#' + err).textContent = 'La KEY no es válida. Revisa que tenga el formato ZEI-XXXX-XXXX-XXXX-XXXX.'; return; }
    const vig = new Date(); vig.setFullYear(vig.getFullYear() + 1);
    S.licencia = {key:k, plan:k.includes('DEMO') ? 'Zona (demostración)' : 'Zona Escolar · anual', activada:isoToday(), vigencia:`${vig.getFullYear()}-${String(vig.getMonth() + 1).padStart(2, '0')}-${String(vig.getDate()).padStart(2, '0')}`};
    log('Activó la licencia'); save(); store.set('zei-data', S); toast('Licencia activada'); render(); return;
  }
  if (f.id === 'f-wiz') {
    const er = wizCollect(); if (er) { $('#w-err').textContent = er; return; }
    if (UI.wizStep < WIZ.length - 1) { UI.wizStep++; render(); return; }
    const {crear, ...z} = UI.wiz;
    S.zona = {...S.zona, ...z, configurada:true};
    if (crear) for (let i = 1; i <= z.numEscuelas; i++) S.escuelas.push({id:uid(), nombre:`Escuela ${i} (por completar)`, cct:'', turno:'Matutino', localidad:'', matricula:''});
    log('Completó la configuración inicial'); store.set('zei-data', S); save(); location.hash = 'inicio'; render(); toast('¡Tu plataforma está lista!'); return;
  }
  if (f.id === 'zona-form') {
    new FormData(f).forEach((val, k) => S.zona[k] = k === 'numEscuelas' ? Number(val) : val);
    log('Actualizó los datos de la zona'); save(); toast('Datos de la zona guardados'); render(); return;
  }
  if (f.id === 'bk-exp') {
    if ($('#bk-p1').value !== $('#bk-p2').value) { $('#bk-err').textContent = 'Las contraseñas no coinciden.'; return; }
    const txt = await encryptBackup($('#bk-p1').value); log('Exportó respaldo cifrado'); save();
    return saveFile(`Respaldo cifrado ${S.zona.nombre} ${isoToday()}.json`, txt);
  }
  if (f.id === 'bk-imp') {
    try { const txt = await $('#bk-file').files[0].text(); const d = await decryptBackup(txt, $('#bk-p3').value); S = d; log('Restauró un respaldo cifrado'); store.set('zei-data', S); toast('Respaldo restaurado'); render(); }
    catch { $('#bk-err2').textContent = 'No se pudo abrir el respaldo. Revisa el archivo y la contraseña.'; }
  }
});
document.addEventListener('click', e => { const b = e.target.closest('#ia-go,#ia-stop'); if (!b) return; if (b.id === 'ia-go') runIA(); else iaCtl?.abort(); });
window.addEventListener('hashchange', () => SESSION && render());

/* ================= Inicio ================= */
(function init() {
  const th = store.get('zei-theme', null); if (th) document.documentElement.setAttribute('data-theme', th);
  load();
  render();
  if (window.claude?.use) {
    window.claude.use('sample').then(s => { SAMPLE = s; if (route() === 'ia' && $('#ia-avail')) render(); }).catch(() => {});
    window.claude.use('downloads').then(d => { DL = d; }).catch(() => {});
  }
})();
</script>
